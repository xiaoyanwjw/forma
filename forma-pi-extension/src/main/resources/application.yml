# Extension-owned defaults live on *Properties (client=apify, actor-id, searcher).
# This file only wires env overrides / secrets.
forma:
  sku-search:
    client: ${FORMA_SKU_SEARCH_CLIENT:apify}
    apify:
      token: ${APIFY_TOKEN:}
  xhs-note-search:
    client: ${FORMA_XHS_NOTE_SEARCH_CLIENT:apify}
    apify:
      token: ${APIFY_TOKEN:}
  xhs-note-fetch:
    client: ${FORMA_XHS_NOTE_FETCH_CLIENT:apify}
    apify:
      token: ${APIFY_TOKEN:}
  web-fetch:
    client: ${FORMA_WEB_FETCH_CLIENT:apify}
    apify:
      token: ${APIFY_TOKEN:}
