    <rect x="420" y="686" width="340" height="64" rx="4" fill="#ffffff" stroke="#fed7aa"/>
    <text x="590" y="712" fill="#c2410c" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">pi-ai</text>
    <text x="590" y="732" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">ModelProvider</text>
