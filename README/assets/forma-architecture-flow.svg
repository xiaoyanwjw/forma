<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 960" role="img" aria-labelledby="title desc">
  <title id="title">Forma architecture flow</title>
  <desc id="desc">Frontend Web, Workbench interface/application/domain, Pi ports, MySQL infrastructure.</desc>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e7e5e4" stroke-width="0.8"/>
    </pattern>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1c1917" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
    <marker id="arrowBrand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect width="1180" height="960" fill="#fafaf9"/>
  <rect width="1180" height="960" fill="url(#grid)"/>

  <text x="40" y="40" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">Forma</text>
  <text x="40" y="62" fill="#78716c" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Planes top-down | Core objects as chips | Browser never talks to the model</text>

  <rect x="40" y="88" width="1100" height="112" rx="4" fill="#f5f5f4" stroke="#e7e5e4" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="60" y="112" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">1. FRONTEND</text>
  <g filter="url(#soft)">
    <rect x="60" y="126" width="1060" height="54" rx="4" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="590" y="158" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Web</text>
  </g>
  <path d="M 590 180 L 590 220" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrowBrand)" fill="none"/>
  <text x="602" y="208" fill="#1c1917" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500">REST + SSE JWT</text>

  <rect x="40" y="228" width="1100" height="380" rx="4" fill="#ffffff" stroke="#1c1917" stroke-width="1.5"/>
  <text x="60" y="254" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="1">2. WORKBENCH</text>

  <rect x="60" y="272" width="1060" height="96" rx="4" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="80" y="296" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">Interface</text>
