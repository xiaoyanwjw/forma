    <text x="201.5" y="449" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Account</text>
  </g>
  <g filter="url(#soft)">
    <rect x="339" y="424" width="243" height="40" rx="4" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="460.5" y="449" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Scene</text>
  </g>
  <g filter="url(#soft)">
    <rect x="598" y="424" width="243" height="40" rx="4" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="719.5" y="449" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Agent</text>
  </g>
  <g filter="url(#soft)">
    <rect x="857" y="424" width="243" height="40" rx="4" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="978.5" y="449" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Computer</text>
  </g>

  <rect x="60" y="496" width="1060" height="96" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="80" y="520" fill="#166534" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">Domain</text>
  <g filter="url(#soft)">
    <rect x="80" y="536" width="329" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="244.5" y="561" fill="#166534" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Identity</text>
  </g>
  <g filter="url(#soft)">
    <rect x="425" y="536" width="329" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
