  <text x="60" y="832" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">4. INFRASTRUCTURE</text>
  <g filter="url(#soft)">
