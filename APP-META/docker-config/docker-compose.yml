services:
  mysql:
    image: mysql:8.0.36
    container_name: forma-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-forma}
      MYSQL_USER: ${DB_USERNAME:-forma}
      MYSQL_PASSWORD: ${DB_PASSWORD:-forma123}
      # 本地开发库直接显示北京时间；生产部署勿照搬此 compose
      TZ: ${MYSQL_TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../bootstrap/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - forma-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  starter:
    image: forma-starter:local
    build:
      context: ../..
      dockerfile: APP-META/docker-config/Dockerfile_starter
      args:
        # Override when Hub/mirrors fail, e.g. STARTER_BASE_IMAGE=forma-java8:local
        BASE_IMAGE: ${STARTER_BASE_IMAGE:-eclipse-temurin:8-jre}
    container_name: forma-starter
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-forma}
      DB_USERNAME: ${DB_USERNAME:-forma}
      DB_PASSWORD: ${DB_PASSWORD:-forma123}
      DB_SERVER_TIMEZONE: ${DB_SERVER_TIMEZONE:-Asia/Shanghai}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32bytes!!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CREDIT_ADMIN_USER_IDS: ${CREDIT_ADMIN_USER_IDS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      FORMA_SKU_SEARCH_CLIENT: ${FORMA_SKU_SEARCH_CLIENT:-apify}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
    ports:
      - "${STARTER_PORT:-8080}:8080"
    networks:
      - forma-network

volumes:
  mysql-data:

networks:
  forma-network:
    driver: bridge
