server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: forma
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产默认 UTC（Spine：存储 UTC）；本地 dev 见 application-dev.yml
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:forma}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${DB_SERVER_TIMEZONE:UTC}
    username: ${DB_USERNAME:forma}
    password: ${DB_PASSWORD:forma123}

mybatis:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml
  type-aliases-package: com.xmut.forma.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  # HS256 密钥至少 32 字节；仅环境变量 / compose secrets
  secret: ${JWT_SECRET:dev-only-change-me-please-32bytes!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

auth:
  rate-limit:
    max-attempts: ${AUTH_RATE_LIMIT_MAX:20}
    window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:60000}

# 手工改档白名单（逗号分隔用户 UUID；空=全部拒绝）
credit:
  admin:
    user-ids: ${CREDIT_ADMIN_USER_IDS:}

# sku-search / xhs-note-* 默认与 APIFY_TOKEN 绑定见 forma-pi-extension/application.yml
forma:
  workspace:
    root: ${FORMA_WORKSPACE_ROOT:}

# 大模型厂商 Key（空 = Stub，不调真模型）
ai:
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      # base-url: https://api.deepseek.com
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

logging:
  level:
    root: INFO
    com.xmut.forma: INFO
